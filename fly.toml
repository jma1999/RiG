# Fly.io configuration for RiG CMMS API
app = "rig-cmms-api"
primary_region = "sjc"

[build]

[env]
  PYTHONPATH = "/app"
  REDIS_URL = "redis://redis:6379/0"
  DATABASE_URL = "postgresql://rig_user:rig_password@postgres:5432/rig"
  NEO4J_URI = "bolt://neo4j:7687"
  NEO4J_USER = "neo4j"
  NEO4J_PASSWORD = "changeme123"
  NEO4J_DATABASE = "neo4j"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[machine]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[[mounts]]
  source = "rig_data"
  destination = "/app/data"
