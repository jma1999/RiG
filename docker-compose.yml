# version: "3.8"   # optional; Compose ignores this now

services:
  # IFC-LD Instance Builder - native IFC to RDF conversion (devonsparks/ifcld-service)
  # Start with: docker compose --profile ifcld up -d ifcld-service
  ifcld-service:
    build:
      context: .
      dockerfile: Dockerfile.ifcld
    ports:
      - "5050:5000"
    profiles:
      - ifcld

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_USER: rig_user
      POSTGRES_PASSWORD: rig_password
      POSTGRES_DB: rig_timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  timescale_data:
